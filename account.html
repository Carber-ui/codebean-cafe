<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="카페 로그인과 회원가입">
  <title>로그인 | 코드빈</title>
  <link rel="stylesheet" href="style.css?v=26">
  <link rel="stylesheet" href="account.css?v=2">
  <script src="account.js?v=3" defer></script>
</head>
<body class="account-page">
<header class="account-page-header">
  <a class="brand" href="index.html#top" aria-label="코드빈 홈"><span class="brand-logo-frame"><img class="brand-logo" src="assets/codebean-cup-logo.png" alt=""></span></a>
</header>
<main class="account-main">
  <section class="account-card" aria-labelledby="account-title">
    <h1 id="account-title">로그인</h1>
    <p class="account-description">계정은 이 브라우저에만 저장됩니다.</p>
    <p class="account-message" id="account-message" role="status" aria-live="polite" hidden></p>

    <form id="login-form">
      <label for="login-id">아이디</label>
      <input id="login-id" name="username" autocomplete="username" maxlength="20" required>
      <label for="login-password">비밀번호</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
      <button class="account-submit" type="submit">로그인</button>
      <p class="account-switch">계정이 없으신가요? <button type="button" data-account-mode="signup">회원가입</button></p>
    </form>

    <form id="signup-form" hidden>
      <label for="signup-id">아이디</label>
      <input id="signup-id" name="username" autocomplete="username" minlength="3" maxlength="20" placeholder="3~20자" required>
      <label for="signup-password">비밀번호</label>
      <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="8자 이상" required>
      <label for="signup-confirm">비밀번호 확인</label>
      <input id="signup-confirm" name="password-confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      <button class="account-submit" type="submit">회원가입</button>
      <p class="account-switch">이미 계정이 있으신가요? <button type="button" data-account-mode="login">로그인</button></p>
    </form>
  </section>
</main>

</body>
</html>
